<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our 365 Days</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #070707;
    --bg-raised: #111110;
    --bg-card: #131211;
    --line: #262422;
    --line-soft: #1a1918;
    --ink: #F3F1EC;
    --ink-dim: #A6A29A;
    --ink-faint: #6B675F;
    --accent: #8C5A52;
    --accent-soft: #4A332F;
    --accent-glow: rgba(140,90,82,0.16);
    --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --sans: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --radius: 3px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  html,body{height:100%;}
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    min-height:100%;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#070707; --bg-raised:#111110; --bg-card:#131211; --line:#262422; --ink:#F3F1EC; --ink-dim:#A6A29A;
    }
  }
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{ background: var(--accent-soft); color: var(--ink); }

  .screen{ min-height:100vh; min-height:100dvh; width:100%; display:flex; flex-direction:column; }
  .hidden{ display:none !important; }

  /* ---------- Password screen ---------- */
  #passwordScreen{
    align-items:center; justify-content:center; text-align:center; padding:32px;
    background:
      radial-gradient(circle at 50% 20%, rgba(140,90,82,0.07), transparent 55%),
      var(--bg);
  }
  .pw-wrap{ width:100%; max-width:360px; opacity:0; animation: riseIn 1.1s ease forwards; }
  @keyframes riseIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  .pw-number{
    font-family: var(--serif); font-weight:500; font-style:italic;
    font-size: clamp(52px, 14vw, 78px); line-height:1; letter-spacing:0.01em;
    margin:0 0 6px;
  }
  .pw-sub{ color: var(--ink-dim); font-size:13px; letter-spacing:0.04em; margin:0 0 46px; }
  .pw-label{ font-size:11px; letter-spacing:0.14em; color: var(--ink-faint); margin-bottom:12px; text-transform:uppercase; }
  #pwInput{
    width:100%; background:transparent; border:none; border-bottom:1px solid var(--line);
    color: var(--ink); font-family: var(--serif); font-size:20px; text-align:center;
    padding:10px 4px 14px; outline:none; letter-spacing:0.08em;
  }
  #pwInput:focus{ border-bottom-color: var(--accent); }
  #pwInput::placeholder{ color: var(--ink-faint); font-style:italic; }
  #unlockBtn{
    margin-top:30px; width:100%; padding:13px; background:transparent;
    border:1px solid var(--line); color:var(--ink); font-size:13px; letter-spacing:0.1em;
    cursor:pointer; border-radius: var(--radius); transition: border-color .3s, background .3s;
  }
  #unlockBtn:hover{ border-color: var(--accent); background: var(--accent-glow); }
  #pwError{ margin-top:16px; font-size:12.5px; color:#B98277; font-style:italic; min-height:16px; opacity:0; transition:opacity .3s; }
  #pwError.show{ opacity:1; }
  .fade-out{ animation: fadeOut .6s ease forwards; }
  @keyframes fadeOut{ to{ opacity:0; transform: scale(0.98); } }

  /* ---------- Person select ---------- */
  #personScreen{ align-items:center; justify-content:center; padding:32px; text-align:center; }
  .ps-title{ font-family:var(--serif); font-style:italic; font-size:26px; margin:0 0 8px; }
  .ps-sub{ color:var(--ink-dim); font-size:13px; margin:0 0 40px; }
  .ps-options{ display:flex; flex-direction:column; gap:12px; width:100%; max-width:320px; }
  .ps-btn{
    background: var(--bg-card); border:1px solid var(--line); color:var(--ink);
    padding:18px; border-radius: var(--radius); cursor:pointer; text-align:left;
    font-family:var(--sans); font-size:14.5px; transition: border-color .25s, background .25s;
  }
  .ps-btn b{ font-family:var(--serif); font-style:italic; font-weight:500; font-size:18px; display:block; margin-bottom:2px; }
  .ps-btn:hover{ border-color: var(--accent); background: var(--accent-glow); }

  /* ---------- App shell ---------- */
  #app{ display:none; flex-direction:column; min-height:100vh; min-height:100dvh; }
  #app.active{ display:flex; }
  .topbar{
    position:sticky; top:0; z-index:20;
    background: rgba(7,7,7,0.86); backdrop-filter: blur(10px);
    border-bottom:1px solid var(--line-soft);
    padding: calc(14px + env(safe-area-inset-top,0px)) 20px 14px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{ font-family:var(--serif); font-style:italic; font-weight:500; font-size:16px; letter-spacing:0.02em; cursor:pointer; }
  .who{ font-size:11px; color:var(--ink-faint); letter-spacing:0.05em; display:flex; align-items:center; gap:8px; }
  .who button{ background:none; border:none; color:var(--ink-faint); text-decoration:underline; cursor:pointer; font-size:11px; padding:0; }

  main{ flex:1; width:100%; max-width:640px; margin:0 auto; padding: 28px 20px 100px; }

  .nav-row{ display:flex; overflow-x:auto; gap:8px; margin: 0 0 30px; padding-bottom:4px; scrollbar-width:none; }
  .nav-row::-webkit-scrollbar{ display:none; }
  .nav-chip{
    flex:0 0 auto; background:transparent; border:1px solid var(--line); color:var(--ink-dim);
    padding:8px 14px; border-radius:20px; font-size:12.5px; cursor:pointer; white-space:nowrap;
    transition: all .2s;
  }
  .nav-chip.active, .nav-chip:hover{ border-color:var(--accent); color:var(--ink); background:var(--accent-glow); }

  /* Home */
  .home-eyebrow{ font-size:11px; letter-spacing:0.16em; color:var(--ink-faint); margin:0 0 6px; }
  .home-tagline{ color:var(--ink-dim); font-size:13.5px; margin:0 0 40px; }
  .day-hero{ text-align:left; margin-bottom:10px; }
  .day-hero .num{
    font-family:var(--serif); font-style:italic; font-weight:500;
    font-size: clamp(56px, 16vw, 92px); line-height:1; margin:0;
  }
  .day-hero .num small{ font-size:0.34em; color:var(--ink-faint); font-style:normal; }
  .day-hero .date{ color:var(--ink-dim); font-size:14px; margin-top:6px; }
  .progress-meta{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-faint); margin:22px 0 8px; letter-spacing:0.02em; }
  .progress-track{ height:2px; background:var(--line); border-radius:2px; overflow:hidden; margin-bottom:40px; }
  .progress-fill{ height:100%; background:var(--accent); }

  .home-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .home-link{
    background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 16px; cursor:pointer; transition:border-color .25s, transform .25s;
  }
  .home-link:hover{ border-color:var(--accent); }
  .home-link .t{ font-family:var(--serif); font-style:italic; font-size:17px; margin-bottom:4px; }
  .home-link .d{ font-size:11.5px; color:var(--ink-faint); }

  /* Section headers */
  .sec-head{ display:flex; align-items:baseline; justify-content:space-between; margin:36px 0 14px; }
  .sec-head h2{ font-family:var(--serif); font-style:italic; font-weight:500; font-size:19px; margin:0; }
  .sec-head:first-child{ margin-top:0; }

  /* Day view */
  .day-topline{ display:flex; align-items:center; justify-content:space-between; margin-bottom:2px; }
  .day-title{ font-family:var(--serif); font-style:italic; font-size:28px; margin:0; }
  .day-status{ font-size:10.5px; letter-spacing:0.08em; color:var(--ink-faint); border:1px solid var(--line); padding:4px 10px; border-radius:20px; }
  .day-status.today{ color:var(--accent); border-color: var(--accent-soft); }
  .day-date{ color:var(--ink-dim); font-size:13.5px; margin:4px 0 34px; }

  .card{ background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius); padding:22px; margin-bottom:16px; }
  .card h3{ font-family:var(--serif); font-style:italic; font-weight:500; font-size:16.5px; margin:0 0 14px; }
  .letter-block{ margin-bottom:22px; }
  .letter-block:last-child{ margin-bottom:0; }
  .letter-who{ font-size:10.5px; letter-spacing:0.1em; color:var(--ink-faint); margin-bottom:8px; text-transform:uppercase; }
  .letter-text{ font-family:var(--serif); font-size:17px; line-height:1.75; white-space:pre-wrap; color:var(--ink); }
  .letter-empty{ font-family:var(--serif); font-style:italic; color:var(--ink-faint); font-size:15px; }
  .btn{
    background:transparent; border:1px solid var(--line); color:var(--ink);
    padding:9px 16px; border-radius:var(--radius); font-size:12.5px; cursor:pointer;
    transition: border-color .2s, background .2s; letter-spacing:0.02em;
  }
  .btn:hover{ border-color:var(--accent); background:var(--accent-glow); }
  .btn-ghost{ border-color:transparent; color:var(--ink-faint); }
  .btn-ghost:hover{ color:var(--ink); background:transparent; border-color:var(--line); }
  .btn-row{ display:flex; gap:10px; margin-top:12px; }
  textarea.editor{
    width:100%; min-height:150px; background:var(--bg-raised); border:1px solid var(--line);
    color:var(--ink); font-family:var(--serif); font-size:16.5px; line-height:1.7;
    padding:14px; border-radius:var(--radius); resize:vertical; outline:none;
  }
  textarea.editor:focus{ border-color:var(--accent); }
  .saved-tick{ font-size:11.5px; color:var(--accent); margin-top:8px; opacity:0; transition:opacity .4s; }
  .saved-tick.show{ opacity:1; }

  /* questions */
  .q-row{ padding:14px 0; border-bottom:1px solid var(--line-soft); }
  .q-row:last-child{ border-bottom:none; }
  .q-text{ font-size:13.5px; color:var(--ink-dim); margin-bottom:9px; }
  .q-options{ display:flex; flex-wrap:wrap; gap:8px; }
  .q-opt{
    border:1px solid var(--line); background:transparent; color:var(--ink-dim);
    font-size:12px; padding:7px 12px; border-radius:20px; cursor:pointer; transition:all .2s;
  }
  .q-opt.sel, .q-opt:hover{ border-color:var(--accent); color:var(--ink); background:var(--accent-glow); }
  .q-scale{ display:flex; gap:6px; flex-wrap:wrap; }
  .q-scale button{
    width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:transparent;
    color:var(--ink-dim); font-size:12px; cursor:pointer;
  }
  .q-scale button.sel{ border-color:var(--accent); color:var(--ink); background:var(--accent-glow); }
  .q-input{
    width:100%; background:var(--bg-raised); border:1px solid var(--line); color:var(--ink);
    padding:10px 12px; border-radius:var(--radius); font-family:var(--sans); font-size:13.5px; outline:none;
  }
  .q-input:focus{ border-color:var(--accent); }
  .q-answer-view{ font-size:14px; color:var(--ink); font-family:var(--serif); font-style:italic; }
  .q-side-label{ font-size:9.5px; letter-spacing:0.1em; color:var(--ink-faint); text-transform:uppercase; margin-bottom:6px; }

  /* archive */
  .arch-item{
    background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px; margin-bottom:10px; cursor:pointer; transition:border-color .2s;
  }
  .arch-item:hover{ border-color:var(--accent); }
  .arch-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .arch-num{ font-family:var(--serif); font-style:italic; font-size:16px; }
  .arch-date{ font-size:11px; color:var(--ink-faint); }
  .arch-preview{ font-family:var(--serif); font-size:14px; color:var(--ink-dim); font-style:italic; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .empty-note{ color:var(--ink-faint); font-size:13.5px; font-style:italic; padding:30px 0; text-align:center; font-family:var(--serif); }

  /* timeline */
  .tl{ position:relative; padding-left:26px; }
  .tl::before{ content:''; position:absolute; left:9px; top:4px; bottom:4px; width:1px; background:var(--line); }
  .tl-row{ position:relative; display:flex; align-items:center; gap:14px; padding:6px 0; cursor:pointer; }
  .tl-dot{ position:absolute; left:-26px; width:19px; height:19px; border-radius:50%; background:var(--bg); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:9px; color:var(--ink-faint); }
  .tl-dot.done{ border-color:var(--accent); background:var(--accent-soft); color:var(--ink); }
  .tl-dot.today{ border-color:var(--accent); background:var(--accent); color:var(--bg); }
  .tl-num{ font-size:13px; color:var(--ink-dim); width:34px; }
  .tl-label{ font-size:11.5px; color:var(--ink-faint); }
  .tl-row.today .tl-num, .tl-row.today .tl-label{ color:var(--ink); }

  /* nav footer (day prev/next) */
  .day-nav{ display:flex; align-items:center; justify-content:space-between; margin-top:36px; padding-top:20px; border-top:1px solid var(--line-soft); }
  .day-nav .mid{ font-size:12px; color:var(--ink-faint); }

  /* final day */
  .final-wrap{ text-align:center; padding:30px 0; }
  .final-wrap h1{ font-family:var(--serif); font-style:italic; font-size:40px; margin:0 0 20px; }
  .final-lines p{ font-family:var(--serif); font-size:19px; margin:4px 0; color:var(--ink-dim); }
  .final-stats{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:36px 0; text-align:left; }
  .fstat{ background:var(--bg-card); border:1px solid var(--line); padding:16px; border-radius:var(--radius); }
  .fstat .n{ font-family:var(--serif); font-style:italic; font-size:26px; }
  .fstat .l{ font-size:11px; color:var(--ink-faint); margin-top:2px; }

  .subtle-line{ text-align:center; color:var(--ink-faint); font-size:12px; font-style:italic; font-family:var(--serif); margin:44px 0 0; }

  .locked-box{ text-align:center; padding:60px 20px; color:var(--ink-faint); }
  .locked-box .lk{ font-size:26px; margin-bottom:12px; }
  .locked-box p{ font-family:var(--serif); font-style:italic; font-size:16px; }

  @media (max-width:480px){
    main{ padding:22px 16px 90px; }
    .home-grid{ grid-template-columns:1fr; }
    .card{ padding:18px; }
  }
</style>
</head>
<body>

<!-- PASSWORD SCREEN -->
<div class="screen" id="passwordScreen">
  <div class="pw-wrap">
    <p class="pw-number">Our 365 Days</p>
    <p class="pw-sub">A private little book for two.</p>
    <div class="pw-label">Enter Password</div>
    <input type="password" id="pwInput" placeholder="Enter our password..." autocomplete="off">
    <button id="unlockBtn">Unlock</button>
    <div id="pwError">That's not our password.</div>
  </div>
</div>

<!-- PERSON SELECT -->
<div class="screen hidden" id="personScreen">
  <div>
    <p class="ps-title">Who's opening the book?</p>
    <p class="ps-sub">This just remembers whose page is yours.</p>
    <div class="ps-options">
      <button class="ps-btn" data-person="p1"><b>Me</b>Person One</button>
      <button class="ps-btn" data-person="p2"><b>My Special Person</b>Person Two</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="brand" id="brandHome">Our 365 Days</div>
    <div class="who"><span id="whoLabel"></span><button id="switchPerson">switch</button></div>
  </div>
  <main id="main"></main>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- Config ---------------- */
  var PASSWORD = "ourbook365";
  var START_DATE = new Date(2026, 8, 22); // Sep 22 2026 — Day 1
  var TOTAL_DAYS = 365;
  var STORE_KEY = "our365_v1";

  var PEOPLE = { p1: "Me", p2: "My Special Person" };

  var QUESTIONS = [
    { id: "missed", text: "Did you miss me today?", type: "choice",
      options: ["Not really","A little","Quite a lot","Very much","More than I can explain"] },
    { id: "missedScale", text: "How much? (1–10)", type: "scale" },
    { id: "thought", text: "Did you think about me today?", type: "choice", options: ["Yes","No","Constantly"] },
    { id: "reminded", text: "What reminded you of me?", type: "text" },
    { id: "tell", text: "What do you want to tell me?", type: "text" },
    { id: "oneword", text: "One word for today", type: "text" }
  ];

  /* ---------------- Storage helpers ---------------- */
  function loadStore(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      return raw ? JSON.parse(raw) : { unlocked:false, person:null, days:{} };
    }catch(e){ return { unlocked:false, person:null, days:{} }; }
  }
  function saveStore(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){}
  }
  var store = loadStore();

  function emptyDay(){
    return {
      letters: { p1:"", p2:"" },
      answers: { p1:{}, p2:{} },
      notes: { p1:"", p2:"" },
      memory: { p1:{}, p2:{} }
    };
  }
  function getDay(n){
    if(!store.days[n]) store.days[n] = emptyDay();
    return store.days[n];
  }

  /* ---------------- Date / day math ---------------- */
  function dayNumFromDate(d){
    var startMid = new Date(START_DATE.getFullYear(), START_DATE.getMonth(), START_DATE.getDate());
    var dMid = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var diff = Math.round((dMid - startMid) / 86400000) + 1;
    if(diff < 1) diff = 1;
    if(diff > TOTAL_DAYS) diff = TOTAL_DAYS;
    return diff;
  }
  function dateForDay(n){
    var d = new Date(START_DATE.getFullYear(), START_DATE.getMonth(), START_DATE.getDate());
    d.setDate(d.getDate() + (n-1));
    return d;
  }
  function fmtDate(d){
    return d.toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' });
  }
  var CURRENT_DAY = dayNumFromDate(new Date());

  function otherPerson(p){ return p === "p1" ? "p2" : "p1"; }

  function dayHasContent(n){
    var day = store.days[n];
    if(!day) return { any:false, both:false };
    var l1 = !!(day.letters.p1 && day.letters.p1.trim());
    var l2 = !!(day.letters.p2 && day.letters.p2.trim());
    return { any: l1||l2, both: l1&&l2, l1:l1, l2:l2 };
  }

  /* ---------------- Router ---------------- */
  function go(route){
    location.hash = route;
  }
  window.addEventListener('hashchange', render);

  /* ---------------- Escaping ---------------- */
  function esc(s){
    return (s||"").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  /* ---------------- Boot ---------------- */
  var $main = document.getElementById('main');

  function boot(){
    if(store.unlocked){
      showApp();
    }else{
      document.getElementById('passwordScreen').classList.remove('hidden');
    }
  }

  document.getElementById('unlockBtn').addEventListener('click', tryUnlock);
  document.getElementById('pwInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter') tryUnlock();
  });
  function tryUnlock(){
    var val = document.getElementById('pwInput').value;
    if(val === PASSWORD){
      store.unlocked = true; saveStore();
      var scr = document.getElementById('passwordScreen');
      scr.classList.add('fade-out');
      setTimeout(function(){
        scr.classList.add('hidden');
        scr.classList.remove('fade-out');
        showApp();
      }, 550);
    }else{
      var err = document.getElementById('pwError');
      err.classList.add('show');
      document.getElementById('pwInput').value = "";
      setTimeout(function(){ err.classList.remove('show'); }, 2200);
    }
  }

  function showApp(){
    if(!store.person){
      document.getElementById('personScreen').classList.remove('hidden');
      var btns = document.querySelectorAll('.ps-btn');
      for(var i=0;i<btns.length;i++){
        btns[i].addEventListener('click', function(){
          store.person = this.getAttribute('data-person'); saveStore();
          document.getElementById('personScreen').classList.add('hidden');
          launchApp();
        });
      }
    }else{
      launchApp();
    }
  }

  function launchApp(){
    document.getElementById('app').classList.add('active');
    document.getElementById('whoLabel').textContent = PEOPLE[store.person];
    document.getElementById('switchPerson').addEventListener('click', function(){
      store.person = null; saveStore();
      document.getElementById('app').classList.remove('active');
      document.getElementById('personScreen').classList.remove('hidden');
      var btns = document.querySelectorAll('.ps-btn');
      for(var i=0;i<btns.length;i++){
        btns[i].onclick = function(){
          store.person = this.getAttribute('data-person'); saveStore();
          document.getElementById('personScreen').classList.add('hidden');
          location.reload();
        };
      }
    });
    document.getElementById('brandHome').addEventListener('click', function(){ go('#/home'); });
    if(!location.hash) go('#/home'); else render();
  }

  /* ---------------- Rendering ---------------- */
  function render(){
    var hash = location.hash || '#/home';
    var parts = hash.replace('#/','').split('/');
    var route = parts[0];

    if(route === 'home') renderHome();
    else if(route === 'day') renderDay(parseInt(parts[1],10) || CURRENT_DAY);
    else if(route === 'archive') renderArchive();
    else if(route === 'timeline') renderTimeline();
    else if(route === 'questions') renderQuestionsPage();
    else if(route === 'notes') renderNotesPage();
    else if(route === 'memories') renderMemoriesPage();
    else renderHome();
    window.scrollTo(0,0);
  }

  function navRow(active){
    var items = [
      ['home','Home'], ['day','Today'], ['archive','Previous Letters'],
      ['questions','Daily Questions'], ['notes','Special Notes'],
      ['memories','Memories'], ['timeline','Timeline']
    ];
    var html = '<div class="nav-row">';
    items.forEach(function(it){
      var isActive = it[0] === active;
      var target = it[0]==='day' ? ('#/day/'+CURRENT_DAY) : ('#/'+it[0]);
      html += '<button class="nav-chip'+(isActive?' active':'')+'" data-go="'+target+'">'+it[1]+'</button>';
    });
    html += '</div>';
    return html;
  }

  function bindNav(){
    var chips = $main.querySelectorAll('[data-go]');
    for(var i=0;i<chips.length;i++){
      chips[i].addEventListener('click', function(){ go(this.getAttribute('data-go')); });
    }
  }

  /* ---- Home ---- */
  function renderHome(){
    var pct = Math.round((CURRENT_DAY/TOTAL_DAYS)*1000)/10;
    var remaining = TOTAL_DAYS - CURRENT_DAY;
    $main.innerHTML =
      '<p class="home-eyebrow">OUR 365 DAYS</p>' +
      '<p class="home-tagline">A little piece of today, saved for us.</p>' +
      '<div class="day-hero"><p class="num">'+CURRENT_DAY+'<small> / '+TOTAL_DAYS+'</small></p>' +
      '<p class="date">'+fmtDate(dateForDay(CURRENT_DAY))+'</p></div>' +
      '<div class="progress-meta"><span>'+pct+'% of our journey</span><span>'+remaining+' days remaining</span></div>' +
      '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>' +
      '<div class="home-grid">' +
        homeLink('day', CURRENT_DAY, "Today's Page", 'Read and write day '+CURRENT_DAY) +
        homeLink('archive', null, 'Previous Letters', 'Every page, kept in order') +
        homeLink('questions', null, 'Daily Questions', 'A little something for today') +
        homeLink('notes', null, 'Special Notes', 'Small things left for you') +
        homeLink('memories', null, 'Memories', "Today's little memory") +
        homeLink('timeline', null, '365-Day Timeline', 'The whole year, at a glance') +
      '</div>' +
      '<p class="subtle-line">Another day, another page of us.</p>';
    bindHomeLinks();
  }
  function homeLink(route, day, title, desc){
    var target = day ? ('#/'+route+'/'+day) : ('#/'+route);
    return '<div class="home-link" data-go="'+target+'"><div class="t">'+title+'</div><div class="d">'+desc+'</div></div>';
  }
  function bindHomeLinks(){
    var els = $main.querySelectorAll('[data-go]');
    for(var i=0;i<els.length;i++){
      els[i].addEventListener('click', function(){ go(this.getAttribute('data-go')); });
    }
  }

  /* ---- Day view ---- */
  function renderDay(n){
    if(n < 1) n = 1;
    if(n > TOTAL_DAYS) n = TOTAL_DAYS;
    if(n === TOTAL_DAYS && n <= CURRENT_DAY){ renderFinal(); return; }

    if(n > CURRENT_DAY){
      renderLockedDay(n);
      return;
    }

    var day = getDay(n);
    var me = store.person, other = otherPerson(me);
    var status = n === CURRENT_DAY ? 'TODAY' : (dayHasContent(n).both ? '✓ Both letters written' : (dayHasContent(n).any ? '✓ Letter written' : 'Waiting for a letter'));

    var html = navRow('day');
    html += '<div class="day-topline"><p class="day-title">Day '+n+' <span style="color:var(--ink-faint); font-size:18px;">/ '+TOTAL_DAYS+'</span></p>' +
      '<span class="day-status'+(n===CURRENT_DAY?' today':'')+'">'+esc(status)+'</span></div>';
    html += '<p class="day-date">'+fmtDate(dateForDay(n))+'</p>';

    // Letters card
    html += '<div class="card"><h3>Today\'s Letter</h3>' + letterBlock(n, me, 'You') + '<div class="line-sep" style="height:1px;background:var(--line-soft);margin:18px 0;"></div>' + letterBlock(n, other, PEOPLE[other]) + '</div>';

    // Daily questions
    html += '<div class="card"><h3>A Little Something For Today</h3>' + questionsBlock(n, me, true) + '</div>';

    // Special note
    html += '<div class="card"><h3>A Special Note For You</h3>' + noteBlock(n, me, other) + '</div>';

    // Memory
    html += '<div class="card"><h3>Today\'s Memory</h3>' + memoryBlock(n, me) + '</div>';

    // prev/next
    html += '<div class="day-nav">' +
      '<button class="btn" data-go="#/day/'+(n-1)+'" '+(n<=1?'disabled style="opacity:.3;"':'')+'>← Previous Day</button>' +
      '<span class="mid">'+n+' / '+TOTAL_DAYS+'</span>' +
      '<button class="btn" data-go="#/day/'+(n+1)+'" '+(n>=CURRENT_DAY && n<TOTAL_DAYS ? 'disabled style="opacity:.3;"':'')+'>Next Day →</button>' +
      '</div>';

    $main.innerHTML = html;
    bindNav();
    bindDayInteractions(n);
    bindKeyboardNav(n);
  }

  function renderLockedDay(n){
    var html = navRow('day');
    html += '<div class="locked-box"><div class="lk">🔒</div><p>Day '+n+' hasn\'t arrived yet.<br>'+fmtDate(dateForDay(n))+'</p></div>';
    html += '<div class="day-nav"><button class="btn" data-go="#/day/'+(n-1)+'">← Previous Day</button><span class="mid">'+n+' / '+TOTAL_DAYS+'</span><span></span></div>';
    $main.innerHTML = html;
    bindNav();
    $main.querySelectorAll('[data-go]').forEach(function(b){ b.addEventListener('click', function(){ go(this.getAttribute('data-go')); }); });
  }

  function letterBlock(n, person, label){
    var day = getDay(n);
    var text = day.letters[person] || "";
    var isMine = person === store.person;
    var blockId = 'letter-'+person+'-'+n;
    var html = '<div class="letter-block"><div class="letter-who">'+esc(label)+'</div>';
    if(text.trim()){
      html += '<div class="letter-text" id="'+blockId+'-view">'+esc(text)+'</div>';
      if(isMine) html += '<div class="btn-row"><button class="btn btn-ghost" data-edit-letter="'+person+'-'+n+'">Edit letter</button></div>';
    }else{
      if(isMine){
        html += '<div class="letter-empty" id="'+blockId+'-empty">This page is still waiting for your words.</div>' +
          '<div class="btn-row"><button class="btn" data-write-letter="'+person+'-'+n+'">+ Write Today\'s Letter</button></div>';
      }else{
        html += '<div class="letter-empty">This page is still waiting for their words.</div>';
      }
    }
    html += '<div id="'+blockId+'-editor" class="hidden">' +
      '<textarea class="editor" placeholder="Write whatever you want to say today...">'+esc(text)+'</textarea>' +
      '<div class="btn-row"><button class="btn" data-save-letter="'+person+'-'+n+'">Save Letter</button><button class="btn btn-ghost" data-cancel-letter="'+person+'-'+n+'">Cancel</button></div>' +
      '<div class="saved-tick" id="'+blockId+'-tick">✓ Saved to Day '+n+'</div>' +
      '</div>';
    html += '</div>';
    return html;
  }

  function questionsBlock(n, person, showBoth){
    var day = getDay(n);
    var mine = day.answers[person] || (day.answers[person] = {});
    var other = otherPerson(person);
    var theirs = day.answers[other] || {};
    var html = '';
    QUESTIONS.forEach(function(q){
      html += '<div class="q-row"><div class="q-text">'+esc(q.text)+'</div>';
      html += '<div class="q-side-label">'+PEOPLE[person]+'</div>';
      html += questionInput(n, person, q, mine[q.id]);
      if(showBoth){
        var theirVal = theirs[q.id];
        html += '<div class="q-side-label" style="margin-top:12px;">'+PEOPLE[other]+'</div>';
        if(theirVal !== undefined && theirVal !== '' && theirVal !== null){
          html += '<div class="q-answer-view">'+esc(String(theirVal))+'</div>';
        }else{
          html += '<div class="letter-empty" style="font-size:13px;">Not answered yet</div>';
        }
      }
      html += '</div>';
    });
    return html;
  }

  function questionInput(n, person, q, val){
    var name = 'q-'+q.id+'-'+person+'-'+n;
    if(q.type === 'choice'){
      var html = '<div class="q-options">';
      q.options.forEach(function(opt){
        html += '<button class="q-opt'+(val===opt?' sel':'')+'" data-qopt="'+n+'|'+person+'|'+q.id+'" data-val="'+esc(opt)+'">'+esc(opt)+'</button>';
      });
      html += '</div>';
      return html;
    }
    if(q.type === 'scale'){
      var html = '<div class="q-scale">';
      for(var i=1;i<=10;i++){
        html += '<button class="'+(val===i?'sel':'')+'" data-qscale="'+n+'|'+person+'|'+q.id+'" data-val="'+i+'">'+i+'</button>';
      }
      html += '</div>';
      return html;
    }
    return '<input class="q-input" type="text" value="'+esc(val||'')+'" placeholder="Type your answer..." data-qtext="'+n+'|'+person+'|'+q.id+'">';
  }

  function noteBlock(n, me, other){
    var day = getDay(n);
    var mineNote = day.notes[me] || "";
    var theirNote = day.notes[other] || "";
    var html = '<div class="letter-who">FROM '+PEOPLE[other].toUpperCase()+'</div>';
    if(theirNote.trim()){
      html += '<div class="letter-text" style="font-size:15px;">'+esc(theirNote)+'</div>';
    }else{
      html += '<div class="letter-empty">If today was difficult, remember that this page is still waiting for you.</div>';
    }
    html += '<div style="height:1px;background:var(--line-soft);margin:18px 0;"></div>';
    html += '<div class="letter-who">FROM YOU</div>';
    if(mineNote.trim()){
      html += '<div class="letter-text" id="note-view-'+n+'" style="font-size:15px;">'+esc(mineNote)+'</div>' +
        '<div class="btn-row"><button class="btn btn-ghost" data-edit-note="'+n+'">Edit note</button></div>';
    }else{
      html += '<div class="letter-empty" id="note-empty-'+n+'">Leave something small for them.</div>' +
        '<div class="btn-row"><button class="btn" data-write-note="'+n+'">+ Add Special Note</button></div>';
    }
    html += '<div id="note-editor-'+n+'" class="hidden">' +
      '<textarea class="editor" style="min-height:90px; font-size:15px;" placeholder="Write a small note...">'+esc(mineNote)+'</textarea>' +
      '<div class="btn-row"><button class="btn" data-save-note="'+n+'">Save Note</button><button class="btn btn-ghost" data-cancel-note="'+n+'">Cancel</button></div>' +
      '</div>';
    return html;
  }

  var MEMORY_FIELDS = [
    { id:'happened', label:'What happened today?' },
    { id:'felt', label:'What did I feel?' },
    { id:'remember', label:'What do I want to remember?' },
    { id:'song', label:'A song for today' },
    { id:'moment', label:'One small moment' }
  ];
  function memoryBlock(n, person){
    var day = getDay(n);
    var mem = day.memory[person] || (day.memory[person] = {});
    var html = '';
    MEMORY_FIELDS.forEach(function(f){
      html += '<div class="q-row"><div class="q-text">'+esc(f.label)+'</div>' +
        '<input class="q-input" type="text" value="'+esc(mem[f.id]||'')+'" placeholder="..." data-mem="'+n+'|'+person+'|'+f.id+'"></div>';
    });
    return html;
  }

  function bindDayInteractions(n){
    // letter write/edit/save/cancel
    $main.querySelectorAll('[data-write-letter],[data-edit-letter]').forEach(function(b){
      b.addEventListener('click', function(){
        var key = this.getAttribute('data-write-letter') || this.getAttribute('data-edit-letter');
        document.getElementById('letter-'+key+'-editor').classList.remove('hidden');
        this.closest('.letter-block').querySelector('.editor').focus();
      });
    });
    $main.querySelectorAll('[data-cancel-letter]').forEach(function(b){
      b.addEventListener('click', function(){
        var key = this.getAttribute('data-cancel-letter');
        document.getElementById('letter-'+key+'-editor').classList.add('hidden');
      });
    });
    $main.querySelectorAll('[data-save-letter]').forEach(function(b){
      b.addEventListener('click', function(){
        var key = this.getAttribute('data-save-letter');
        var parts = key.split('-'); var person = parts[0]; var day = parseInt(parts[1],10);
        var ta = this.closest('.letter-block').querySelector('textarea.editor');
        getDay(day).letters[person] = ta.value;
        saveStore();
        renderDay(day);
      });
    });
    // notes
    $main.querySelectorAll('[data-write-note],[data-edit-note]').forEach(function(b){
      b.addEventListener('click', function(){
        var d = this.getAttribute('data-write-note') || this.getAttribute('data-edit-note');
        document.getElementById('note-editor-'+d).classList.remove('hidden');
      });
    });
    $main.querySelectorAll('[data-cancel-note]').forEach(function(b){
      b.addEventListener('click', function(){
        document.getElementById('note-editor-'+this.getAttribute('data-cancel-note')).classList.add('hidden');
      });
    });
    $main.querySelectorAll('[data-save-note]').forEach(function(b){
      b.addEventListener('click', function(){
        var d = parseInt(this.getAttribute('data-save-note'),10);
        var ta = document.getElementById('note-editor-'+d).querySelector('textarea');
        getDay(d).notes[store.person] = ta.value;
        saveStore();
        renderDay(d);
      });
    });
    bindQuestionInputs();
    bindMemoryInputs();
    // nav buttons
    $main.querySelectorAll('[data-go]').forEach(function(b){
      b.addEventListener('click', function(){
        if(this.hasAttribute('disabled')) return;
        go(this.getAttribute('data-go'));
      });
    });
  }

  function bindQuestionInputs(){
    $main.querySelectorAll('[data-qopt]').forEach(function(b){
      b.addEventListener('click', function(){
        var k = this.getAttribute('data-qopt').split('|');
        var n=parseInt(k[0],10), person=k[1], qid=k[2], val=this.getAttribute('data-val');
        var day = getDay(n);
        if(!day.answers[person]) day.answers[person]={};
        day.answers[person][qid] = val;
        saveStore();
        render();
      });
    });
    $main.querySelectorAll('[data-qscale]').forEach(function(b){
      b.addEventListener('click', function(){
        var k = this.getAttribute('data-qscale').split('|');
        var n=parseInt(k[0],10), person=k[1], qid=k[2], val=parseInt(this.getAttribute('data-val'),10);
        var day = getDay(n);
        if(!day.answers[person]) day.answers[person]={};
        day.answers[person][qid] = val;
        saveStore();
        render();
      });
    });
    $main.querySelectorAll('[data-qtext]').forEach(function(inp){
      inp.addEventListener('change', function(){
        var k = this.getAttribute('data-qtext').split('|');
        var n=parseInt(k[0],10), person=k[1], qid=k[2];
        var day = getDay(n);
        if(!day.answers[person]) day.answers[person]={};
        day.answers[person][qid] = this.value;
        saveStore();
      });
    });
  }
  function bindMemoryInputs(){
    $main.querySelectorAll('[data-mem]').forEach(function(inp){
      inp.addEventListener('change', function(){
        var k = this.getAttribute('data-mem').split('|');
        var n=parseInt(k[0],10), person=k[1], fid=k[2];
        var day = getDay(n);
        if(!day.memory[person]) day.memory[person]={};
        day.memory[person][fid] = this.value;
        saveStore();
      });
    });
  }

  function bindKeyboardNav(n){
    document.onkeydown = function(e){
      if(location.hash.indexOf('#/day') !== 0) return;
      if(e.key === 'ArrowLeft' && n>1) go('#/day/'+(n-1));
      if(e.key === 'ArrowRight' && n<CURRENT_DAY) go('#/day/'+(n+1));
    };
  }

  /* ---- Archive ---- */
  function renderArchive(){
    var html = navRow('archive');
    html += '<div class="sec-head"><h2>Our Letters</h2></div>';
    var any = false;
    for(var n = CURRENT_DAY; n >= 1; n--){
      var c = dayHasContent(n);
      if(!c.any && n !== CURRENT_DAY) continue;
      any = true;
      var day = store.days[n] || emptyDay();
      var preview = (day.letters[store.person] || day.letters[otherPerson(store.person)] || "The first page...").trim();
      if(!preview) preview = n===CURRENT_DAY ? "This page is still waiting for words." : "";
      html += '<div class="arch-item" data-go="#/day/'+n+'"><div class="arch-top"><span class="arch-num">'+pad(n)+' / '+TOTAL_DAYS+'</span><span class="arch-date">'+fmtDate(dateForDay(n)).replace(', '+dateForDay(n).getFullYear(),'')+'</span></div><div class="arch-preview">'+esc(preview.slice(0,90))+'</div></div>';
    }
    if(!any) html += '<div class="empty-note">The first page is still blank.</div>';
    $main.innerHTML = html;
    bindNav();
    $main.querySelectorAll('.arch-item').forEach(function(el){ el.addEventListener('click', function(){ go(this.getAttribute('data-go')); }); });
  }
  function pad(n){ return n<10 ? '00'+n : n<100 ? '0'+n : ''+n; }

  /* ---- Timeline ---- */
  function renderTimeline(){
    var html = navRow('timeline');
    html += '<div class="sec-head"><h2>365-Day Timeline</h2></div>';
    html += '<div class="tl">';
    for(var n=1;n<=TOTAL_DAYS;n++){
      var cls = '', dotCls='', icon='';
      if(n < CURRENT_DAY){ var c=dayHasContent(n); dotCls = c.any ? 'done' : ''; icon = c.any ? '✓' : ''; }
      else if(n === CURRENT_DAY){ dotCls='today'; cls='today'; icon='●'; }
      else { icon='🔒'; }
      var label = n<CURRENT_DAY ? (dayHasContent(n).any ? 'Letter written' : 'Waiting') : n===CURRENT_DAY ? 'Today' : 'Locked';
      html += '<div class="tl-row '+cls+'" data-go="#/day/'+n+'"><span class="tl-dot '+dotCls+'">'+icon+'</span><span class="tl-num">'+pad(n)+'</span><span class="tl-label">'+label+'</span></div>';
    }
    html += '</div>';
    $main.innerHTML = html;
    bindNav();
    $main.querySelectorAll('.tl-row').forEach(function(el){ el.addEventListener('click', function(){ go(this.getAttribute('data-go')); }); });
  }

  /* ---- Dedicated Questions page (today) ---- */
  function renderQuestionsPage(){
    var html = navRow('questions');
    html += '<div class="sec-head"><h2>A Little Something For Today</h2></div>';
    html += '<p class="day-date" style="margin-top:-8px;">Day '+CURRENT_DAY+' · '+fmtDate(dateForDay(CURRENT_DAY))+'</p>';
    html += '<div class="card">' + questionsBlock(CURRENT_DAY, store.person, true) + '</div>';
    $main.innerHTML = html;
    bindNav();
    bindQuestionInputs();
  }

  /* ---- Dedicated Notes page ---- */
  function renderNotesPage(){
    var html = navRow('notes');
    html += '<div class="sec-head"><h2>Special Notes</h2></div>';
    html += '<p class="day-date" style="margin-top:-8px;">Day '+CURRENT_DAY+' · '+fmtDate(dateForDay(CURRENT_DAY))+'</p>';
    html += '<div class="card">' + noteBlock(CURRENT_DAY, store.person, otherPerson(store.person)) + '</div>';
    html += '<div class="sec-head"><h2>Earlier notes</h2></div>';
    var any=false;
    for(var n=CURRENT_DAY-1;n>=1;n--){
      var day = store.days[n];
      if(!day) continue;
      var t = day.notes[store.person], o = day.notes[otherPerson(store.person)];
      if(!(t&&t.trim()) && !(o&&o.trim())) continue;
      any=true;
      html += '<div class="arch-item" data-go="#/day/'+n+'"><div class="arch-top"><span class="arch-num">'+pad(n)+' / '+TOTAL_DAYS+'</span><span class="arch-date">'+fmtDate(dateForDay(n))+'</span></div><div class="arch-preview">'+esc(((o||t)||'').slice(0,90))+'</div></div>';
    }
    if(!any) html += '<div class="empty-note">No earlier notes yet.</div>';
    $main.innerHTML = html;
    bindNav();
    bindDayInteractions(CURRENT_DAY);
    $main.querySelectorAll('.arch-item').forEach(function(el){ el.addEventListener('click', function(){ go(this.getAttribute('data-go')); }); });
  }

  /* ---- Dedicated Memories page ---- */
  function renderMemoriesPage(){
    var html = navRow('memories');
    html += '<div class="sec-head"><h2>Today\'s Little Memory</h2></div>';
    html += '<p class="day-date" style="margin-top:-8px;">Day '+CURRENT_DAY+' · '+fmtDate(dateForDay(CURRENT_DAY))+'</p>';
    html += '<div class="card">' + memoryBlock(CURRENT_DAY, store.person) + '</div>';
    html += '<div class="sec-head"><h2>Earlier memories</h2></div>';
    var any=false;
    for(var n=CURRENT_DAY-1;n>=1;n--){
      var day = store.days[n];
      if(!day) continue;
      var mem = day.memory[store.person] || {};
      var vals = Object.keys(mem).map(function(k){return mem[k];}).filter(Boolean);
      if(!vals.length) continue;
      any=true;
      html += '<div class="arch-item" data-go="#/day/'+n+'"><div class="arch-top"><span class="arch-num">'+pad(n)+' / '+TOTAL_DAYS+'</span><span class="arch-date">'+fmtDate(dateForDay(n))+'</span></div><div class="arch-preview">'+esc(vals.join(' · ').slice(0,90))+'</div></div>';
    }
    if(!any) html += '<div class="empty-note">No earlier memories yet.</div>';
    $main.innerHTML = html;
    bindNav();
    bindMemoryInputs();
    $main.querySelectorAll('.arch-item').forEach(function(el){ el.addEventListener('click', function(){ go(this.getAttribute('data-go')); }); });
  }

  /* ---- Final day ---- */
  function renderFinal(){
    var letters=0, memories=0, notes=0, answers=0, days=0;
    for(var n=1;n<=TOTAL_DAYS;n++){
      var day = store.days[n];
      if(!day) continue;
      var c = dayHasContent(n);
      if(c.any) days++;
      if(c.l1) letters++;
      if(c.l2) letters++;
      ['p1','p2'].forEach(function(p){
        if(day.notes[p] && day.notes[p].trim()) notes++;
        var mem = day.memory[p]||{};
        if(Object.keys(mem).some(function(k){return mem[k];})) memories++;
        var ans = day.answers[p]||{};
        answers += Object.keys(ans).filter(function(k){return ans[k]!==undefined && ans[k]!=='';}).length;
      });
    }
    var day365 = getDay(TOTAL_DAYS);
    var me = store.person, other = otherPerson(me);
    var html = navRow('day');
    html += '<div class="final-wrap">' +
      '<h1>365 / 365</h1>' +
      '<div class="final-lines"><p>One year.</p><p>365 days.</p><p>Two people.</p><p>One little book.</p></div>' +
      '<div class="final-stats">' +
        fstat(letters,'Letters written') + fstat(days,'Days completed') +
        fstat(memories,'Memories saved') + fstat(notes,'Special notes') + fstat(answers,'Daily answers') +
      '</div></div>';
    html += '<div class="sec-head"><h2>One Last Letter</h2></div>';
    html += '<div class="card">' + letterBlock(TOTAL_DAYS, me, 'You') + '<div style="height:1px;background:var(--line-soft);margin:18px 0;"></div>' + letterBlock(TOTAL_DAYS, other, PEOPLE[other]) + '</div>';
    html += '<p class="subtle-line">This page belongs to us.</p>';
    $main.innerHTML = html;
    bindNav();
    bindDayInteractions(TOTAL_DAYS);
  }
  function fstat(n,l){ return '<div class="fstat"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'; }

  boot();
})();
</script>
</body>
</html>
